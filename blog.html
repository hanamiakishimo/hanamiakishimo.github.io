<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>札记 - 霜花喵窝</title>
  <link rel="stylesheet" href="notes.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>札记</h1>
      <p class="subtitle">短文、碎片、草稿，都先堆这里。</p>
      <a class="back-link" href="index.html">← 返回首页</a>
    </header>

    <main class="notes-layout">
      <section class="notes-card">
        <h2>短记</h2>
        <ul class="notes-list">
          <li><span class="muted">整理中</span></li>
        </ul>
      </section>

      <section class="notes-card">
        <h2>草稿</h2>
        <ul class="notes-list">
          <li><span class="muted">还没放出来</span></li>
        </ul>
      </section>

      <section class="notes-card">
        <h2>搬运</h2>
        <ul class="notes-list">
          <li><span class="muted">之后再搬</span></li>
        </ul>
      </section>
    </main>

    <footer class="page-footer">
      <p id="today-text">今天也先堆着。</p>
    </footer>
  </div>

  <script src="notes.js"></script>
</body>
                                              </html>
