<html>
<head>
  <link rel="stylesheet" href="incident.cas">
  
</head>
  <body>
    <main>
    
      <h1 class="glitch-title" data-text="INCIDENT REPORT #01">INCIDENT REPORT #01</h1>
    <h1>发作。总之。不对头。</h1>
      <section>
      <div class="terminal-box">
  <p class="prompt">> cat post_mortem.log</p>
  <p id="terminal-log" data-fulltext="猫咪症严重了。耷拉。发作。
      受不了自己。不知道有什么意义。
      想申请天国单次签注但是。
      没那个胆量。不知道做什么才是正确的。我恶心死了。
      我严重了或者怎么样，不知道。
      可能早就鼠了这一切是跑马灯。"></p>
      </div>
    <p id="symptoms" class="card">
    </p>
    
    </section>
    </main>
    <script>
  // 赛博终端打字机效果
  const terminalText = document.getElementById('terminal-log');
  const fullText = terminalText.getAttribute('data-fulltext');
  let index = 0;
  
  function typeWriter() {
    if (index < fullText.length) {
      terminalText.innerHTML += fullText.charAt(index);
      index++;
      setTimeout(typeWriter, 30); // 30ms 打印一个字，速度可调
    } else {
      // 打印完后加个闪烁的光标
      terminalText.innerHTML += '<span class="cursor">_</span>';
    }
  }
  
  // 页面加载完后开始打字
  window.onload = typeWriter;
    </script>
  </body>
</html>
